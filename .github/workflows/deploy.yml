# Builds on Linux and deploys the prebuilt output to Vercel.
#
# Why this exists: a normal Vercel remote build of this app fails on the
# Hobby plan with "No more than 12 Serverless Functions". Building with the
# Vercel CLI and uploading the result (`--prebuilt`) sidesteps that. It has
# to run on Linux: the CLI creates symlinks between function folders, and
# when built on Windows those are written with backslash paths that are
# broken once uploaded to Vercel (ENOENT ... .segment.rsc.func).
#
# One-time setup — repo Settings → Secrets and variables → Actions:
#   VERCEL_TOKEN       create at https://vercel.com/account/tokens
#   VERCEL_ORG_ID      "orgId" in .vercel/project.json (after `vercel pull`)
#   VERCEL_PROJECT_ID  "projectId" in the same file
#
# Notes:
#  - Every NEXT_PUBLIC_* variable must NOT be marked "Sensitive" in Vercel.
#    `vercel pull` can't download sensitive values, so they'd be baked into
#    the browser bundle as the literal text "[SENSITIVE]".
#  - Don't commit a .env file: `next build` would pick it up.

name: Deploy to Vercel (prebuilt)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel production settings and environment variables
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (Linux)
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
